name: Vérifier une proposition

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.19'
          tinytex: true
      - name: Préparer une démonstration technique fictive
        run: python tests/demo.py --output build/demo
      - name: Tester le rendu HTML et PDF sans contenu privé
        run: python tools/brainbrew.py --catalog build/demo/catalog.yml --content-root build/demo/content --output build/demo-site --render
